    # FAQ Section
    faq_eyebrow: "Merak Edilenler"
    faq_title: "Sıkça Sorulan Sorular"
    faq_1_q: "Araç kiralamak için asgari yaş sınırı nedir?"
    faq_1_a: "Türkiye kiralama pazarında asgari yaş ekonomik araçlar için genellikle 21, orta sınıf ve SUV modellerde 25 ile 28 arasına çıkabilmektedir. Kesin gereksinimler ve kiralama koşulları araç modeline ve kiralama planına göre ekibimiz tarafından teyit edilir."
    faq_2_q: "Ehliyetimin kaç yıllık olması gerekir?"
    faq_2_a: "Türkiye genelindeki kiralama uygulamalarında standart araçlar için en az 1-2 yıllık, SUV ve üst sınıf araçlar için 3 veya daha fazla yıllık ehliyet aranır. Kesin gereksinimler ve kiralama koşulları araç modeline ve kiralama planına göre ekibimiz tarafından teyit edilir."
    faq_3_q: "Yabancı ziyaretçilerin Uluslararası Ehliyet (IDP) alması şart mı?"
    faq_3_a: "Latin harfli ulusal ehliyetler 6 aya kadar turist olarak kullanılabilir. Ancak ehliyetiniz Arapça veya Kiril gibi Latin dışı alfabelerle yazılmışsa Uluslararası Sürücü Belgesi veya onaylı tercüme talep edilir. Bu bilgiler hukuki tavsiye değildir; lütfen seyahatiniz öncesinde ekibimizle teyit edin."
    faq_4_q: "Kiralama ücretine kasko dahil mi?"
    faq_4_a: "Evet. 61 EDİZ TRAVEL aracılığıyla düzenlenen kiralamalarda kapsamlı araç kaskosu fiyata dahildir. Kesin teminat koşulları rezervasyon öncesinde ekibimizle paylaşılır."
    faq_5_q: "Kredi kartı ve depozito gerekiyor mu?"
    faq_5_a: "Türkiye genelindeki kiralama uygulamalarında, HGS otoyol geçişleri ve yakıt farkları için ana sürücü adına kredi kartından geçici provizyon alınması standarttır. Kesin gereksinimler ve kiralama koşulları araç modeline ve kiralama planına göre ekibimiz tarafından teyit edilir."
    faq_6_q: "Aracı başka biri de kullanabilir mi?"
    faq_6_a: "Evet, ek sürücü kimlik ve ehliyet bilgilerini ibraz edip yaş ve ehliyet kriterlerini karşıladığı takdirde sözleşmeye dahil edilebilir. Lütfen önceden bilgi veriniz."
    faq_7_q: "Aracı Trabzon Havalimanı'nda teslim alabilir miyim?"
    faq_7_a: "Evet. Uçuş saatinize uygun olarak Trabzon Havalimanı'nda teslimat ve iade önceden koordine edilebilmektedir. Şehir içi veya konaklama noktalarında teslimat seçenekleri de önceden kararlaştırılabilir."
    faq_8_q: "Nasıl araç talep edebilirim?"
    faq_8_a: "Sayfadaki 'Aracınızı Seçin' butonuna veya WhatsApp simgesine tıklayarak seyahat tarihlerinizi ve tercih ettiğiniz araç tipini iletebilirsiniz; ekibimiz uygun seçenekleri ve kesin koşulları sizinle netleştirir."

