    vs_nature_point_1: "Çam kokusu ve serin yayla havasıyla tam bir huzur ortamı"
    vs_nature_point_2: "Güne doğrudan dağ manzarası eşliğinde başlama ayrıcalığı"
    vs_nature_point_3: "Gündüz ziyaretçileri ayrıldıktan sonra vadinin sakinliğini yaşama imkanı"
    vs_nature_point_4: "Ahşap verandalar ve dere şırıltısıyla özgün Karadeniz atmosferi"

