    flow_3_num: "03"
    flow_3_title: "Koşulları Netleştirin"
    flow_3_desc: "Müsaitlik, toplam kiralama bedeli, depozito ve gerekli belgeleri birlikte netleştirelim."
    flow_4_num: "04"
    flow_4_title: "Teslim Alın ve Keşfedin"
    flow_4_desc: "Aracınızı Trabzon Havalimanı'nda veya belirlenen adreste önceden koordine edilen teslimatla alarak yolculuğunuza başlayın."

    # Self-Drive vs Chauffeured
    vs_eyebrow: "Seçenekleri Karşılaştırın"
