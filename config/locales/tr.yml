    help_2_title: "Kişi Sayısı ve Yatak Düzeni"
    help_2_desc: "Ailenizin veya grubunuzun sıkışmadan, gerçek anlamda rahat edeceği oda ve yatak kapasitesini teyit ediyoruz."
    help_3_title: "Yol ve Araç Uygunluğu"
    help_3_desc: "Kimi yayla evlerinin yolu dik veya stabilizedir. Kiralık aracınızın veya tercih ettiğiniz ulaşım türünün yola uygunluğunu kontrol ediyoruz."
    help_4_title: "Yerel İşletmelerle İletişim"
    help_4_desc: "Bölgede bilinen işletmeleri önceliklendiriyor; tesis imkanları ve beklentiler konusunda yerel ev sahipleriyle önceden iletişim kuruyoruz."

    # Considerations Before Choosing
    consider_eyebrow: "Pratik Tavsiyeler"
    consider_title: "Karar Vermeden Önce Nelere Dikkat Edilmeli?"
    consider_subtitle: "Doğu Karadeniz'de konaklama seçerken bölgenin coğrafi gerçeklerini göz önünde bulundurun."
    con_1_title: "Yayla Yolu Koşulları"
    con_1_desc: "Kimi orman içi bungalovlar dik ve virajlı yollarda bulunabilir. Kendi aracınızı sürme konusunda emin değilseniz şoförlü araç seçeneğini değerlendirebilirsiniz."
    con_2_title: "Mevsimlik Yayla Havası"
    con_2_desc: "Yayla sıcaklıkları sahile kıyasla oldukça serindir. Yaz aylarında dahi akşamları sis ve yağmur görülebilir; tesisin ısıtma imkanlarını önceden teyit etmenizi öneririz."
    con_3_title: "Yeme-İçme İmkânları"
    con_3_desc: "Şehir otellerinde restoranlara adım mesafesindeyken, izole yayla evlerinde akşam yemeği için tesisin mutfağı veya küçük bir sürüş gerekebilir."
    con_4_title: "Merdiven ve Bagaj Durumu"
    con_4_desc: "İki katlı ahşap bungalovlar genellikle ahşap merdivenlere sahiptir. Bebek arabası veya hareket kısıtlılığı olan misafirlerimizin oda tipini önceden teyit etmesi faydalıdır."

    # For Families, Couples, Groups
    groups_eyebrow: "Seyahat Grupları"
