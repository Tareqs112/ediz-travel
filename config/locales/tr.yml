    # WhatsApp message
    whatsapp_message: "Merhaba 61 EDİZ TRAVEL, Trabzon / Doğu Karadeniz bölgesinde konaklama ayarlamak istiyorum. Konaklama bilgilerim:"

    # Why It Matters Section
    matters_eyebrow: "Seyahat Tasarımı"
    matters_title: "Konaklama Seçimi Neden Önemlidir?"
    matters_subtitle: "Doğu Karadeniz coğrafyasında konaklayacağınız nokta, günlük seyahat temponuzu ve yol konforunuzu doğrudan şekillendirir."
    matter_1_title: "Şehir Kolaylığı ve Yayla Dinginliği"
    matter_1_desc: "Şehir oteli sahil restoranlarını, tarihi noktaları ve havalimanı yakınlığını ayağınıza getirirken; dağ bungalovu sisli sabahlar ve doğayla baş başa bir uyanış sunar."
    matter_2_title: "Dağ Yolu Yorgunluğunu Azaltmak"
    matter_2_desc: "Yayla vadileri arasındaki mesafeler virajlı yollardan oluşur. Gezi noktalarınıza yakın bir konaklama üssü seçmek, enerjinizi yola değil manzaraya ayırmanızı sağlar."
    matter_3_title: "Grubunuza Uygun Yaşam Alanı"
    matter_3_desc: "Çiftler vadinin sessizliğini ve özel balkon manzarasını önemserken; çocuklu aileler çok odalı, ferah salonlu ve pratik apart dairelerde çok daha rahat eder."

    # Types of Stays Section
    types_eyebrow: "Konaklama Tarzları"
    types_title: "Bölgede Dört Farklı Konaklama Deneyimi"
    types_subtitle: "Doğu Karadeniz'de her seyahat tarzına ve tatil beklentisine hitap eden başlıca dört konaklama kategorisi bulunmaktadır."
    type_hotels_badge: "Hizmet & Kolaylık"
    type_hotels_title: "Oteller ve Butik Tesisler"
    type_hotels_desc: "Trabzon şehir merkezinde, sahil şeridinde ve ana kavşaklarda yer alan konforlu tesisler. Resepsiyon hizmetleri, şehir restoranlarına yürüyüş mesafesi ve günlük turlar için merkezi bir hareket noktası arayanlar için idealdir."
    type_hotels_suit: "Kimler için uygun: İlk kez gelenler, kısa süreli kalanlar ve kesintisiz şehir imkanları isteyenler."
    type_bungalows_badge: "Doğayla İç İçe"
    type_bungalows_title: "Ahşap Bungalovlar"
    type_bungalows_desc: "Geleneksel ahşap mimariyle inşa edilmiş, orman yamaçlarına, çay bahçelerine ve coşkulu derelerin kıyısına konumlanmış özgün yapılar. Özel veranda alanlarıyla Karadeniz doğasını doğrudan hissettirir."
    type_bungalows_suit: "Kimler için uygun: Çiftler, huzur arayanlar ve kuş sesleriyle uyanmak isteyen doğaseverler."
    type_chalets_badge: "Yayla Kaçamağı"
    type_chalets_title: "Dağ Evleri (Şaleler)"
    type_chalets_desc: "Uzungöl ve Ayder çevresindeki yüksek platolarda yer alan geniş ahşap ve taş mimarili yayla evleri. Ferah yaşam alanları, dağ panoramaları ve bulutların üzerinde dingin bir tatil sunar."
    type_chalets_suit: "Kimler için uygun: Aileler, arkadaş grupları ve doğanın kalbinde uzun süreli dinlenmek isteyenler."
    type_apartments_badge: "Aile Konforu"
    type_apartments_title: "Eşyalı Apart Daireler"
    type_apartments_desc: "Birden fazla yatak odası, geniş oturma salonu ve mutfak donanımına sahip daireler. Trabzon'un nezih semtlerinde ev konforunda, bağımsız ve ekonomik bir alan sağlar."
    type_apartments_suit: "Kimler için uygun: Kalabalık aileler, uzun süreli konaklamalar ve geniş alan arayanlar."

    # Where to Stay Section
    where_eyebrow: "Bölge Coğrafyası"
    where_title: "Hangi Bölgede Konaklamalısınız?"
    where_subtitle: "Her lokasyon farklı bir doğa karakterine ve gezi avantajına sahiptir. Seyahat planınıza uygun konaklamayı belirleyelim:"
    loc_1_name: "Trabzon Şehir Merkezi ve Sahil"
    loc_1_tag: "Merkezi Çıkış Noktası"
    loc_1_desc: "Havalimanına hızlı ulaşım, sahil yürüyüş yolları, Ayasofya ve Atatürk Köşkü gibi tarihi ziyaretler ve zengin Karadeniz mutfağı için en pratik seçimdir. Tüm yönlere yapılacak günlük geziler için ideal bir üs görevi görür."
    loc_2_name: "Uzungöl ve Çevre Vadiler"
    loc_2_tag: "İkonik Dağ Gölü"
    loc_2_desc: "Soğanlı Dağları'nın eteklerinde, çam ormanlarıyla çevrili Uzungöl'de konaklamak; gündüz turlarının kalabalığı çekildikten sonra gölün en sakin sabah ve akşam saatlerini yaşamanızı sağlar."
    loc_3_name: "Ayder Yaylası ve Fırtına Vadisi"
    loc_3_tag: "Şelaleler ve Yayla Yeşili"
    loc_3_desc: "Gürül gürül akan Fırtına Deresi, tarihi kemer köprüler ve Kaçkar eteklerindeki yaylalar. Zilkale, Palovit Şelalesi ve Elevit gibi eşsiz noktalara yakın olmak isteyenler için mükemmel bir tercihtir."
    loc_4_name: "Yüksek Yayla Sırtları ve Köy Evleri"
    loc_4_tag: "Bulutların Üzerinde Sükunet"
    loc_4_desc: "Hıdırnebi, Maçka ve Zigana sırtlarında yer alan sakin yapılar. Tertemiz yayla havası, geleneksel Karadeniz misafirperverliği ve ticari kalabalıktan tamamen uzak bir dinginlik sunar."

    # Comparison: City vs Nature
    vs_eyebrow: "Ortamları Karşılaştırın"
    vs_title: "Şehir Konaklaması mı, Doğa Konaklaması mı?"
    vs_subtitle: "Konaklamanızı kesinleştirmeden önce tatil temponuzla hangi çevrenin daha iyi örtüştüğünü değerlendirin."
    vs_city_badge: "Şehir Konaklaması"
    vs_city_title: "Trabzon Şehir Merkezi & Sahil"
    vs_city_point_1: "Trabzon Havalimanı ve ana sahil yoluna dakikalar içinde erişim"
    vs_city_point_2: "Restoranlar, çarşılar, kafeler ve tarihi noktalara yürüme mesafesi"
    vs_city_point_3: "Kesintisiz şehir altyapısı, hızlı bağlantı ve sağlık hizmetlerine yakınlık"
    vs_city_point_4: "Farklı yönlere yapılacak turlarda dengeli bir merkez konumu"
    vs_nature_badge: "Doğa / Yayla Konaklaması"
