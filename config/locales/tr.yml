    eco_tours_link: "Özel Turlarımızı İnceleyin"

    # Practical FAQ
    faq_eyebrow: "Sık Sorulan Sorular"
    faq_title: "Konaklama Hakkında Merak Edilenler"
    faq_1_q: "Hangi tür konaklama seçeneklerini ayarlayabiliyorsunuz?"
    faq_1_a: "Trabzon ve Doğu Karadeniz genelinde şehir otelleri, butik oteller, dere kenarı ahşap bungalovlar, yayla dağ evleri ve eşyalı aile apartları ayarlıyoruz."
    faq_2_q: "Bölgenin hangi noktalarında konaklama ayarlayabilirsiniz?"
    faq_2_a: "Gezi planınıza bağlı olarak Trabzon şehir merkezi, Akçaabat, Uzungöl, Çaykara, Rize, Fırtına Vadisi, Ayder Yaylası ve çevre yaylalarda koordinasyon sağlıyoruz."
    faq_3_q: "Trabzon merkezde mi yoksa yaylalarda mı kalmalıyım?"
    faq_3_a: "Pek çok misafirimiz dengeli bir program tercih eder: 2-3 gece şehir içi tarihi yerler ve alışveriş için Trabzon merkezde, ardından 2-3 gece doğa ve sessizlik için Uzungöl veya Ayder'de konaklamak yaygın bir tercihtir."
    faq_4_q: "Konaklama rezervasyonunu ulaşım hizmetleriyle birlikte alabilir miyim?"
    faq_4_a: "Evet. Konaklamanızı havalimanı transferi, kiralık araç veya şoförlü aracımızla birlikte planlamak tüm tatil akışınızı sorunsuz ve senkronize hale getirir."
    faq_5_q: "Apartlar ve dağ evleri kalabalık aileler için uygun mudur?"
    faq_5_a: "Evet. Trabzon'daki çok odalı daireler ve vadilerdeki şaleler, geniş oturma alanı, mutfak ve mahremiyet arayan aileler için oldukça elverişlidir."
    faq_6_q: "Gezi rotama göre konaklama yeri tavsiye ediyor musunuz?"
    faq_6_a: "Kesinlikle. Görmek istediğiniz yerleri bize ilettiğinizde, dağ yollarında vakit kaybetmemeniz için en mantıklı konaklama üslerini sizin için planlıyoruz."
    faq_7_q: "Ne kadar önceden iletişime geçmeliyiz?"
    faq_7_a: "Özellikle Haziran-Eylül arası yoğun yaz sezonunda nitelikli ahşap bungalovlar ve dağ evleri aylar öncesinden dolabilmektedir. Uçak biletleriniz netleşir netleşmez iletişime geçmenizi öneririz."
    faq_8_q: "Farklı vadilerde bölünmüş konaklama ayarlayabilir misiniz?"
    faq_8_a: "Evet. Seyahatinizin ilk günlerini Trabzon merkezde, sonraki günlerini ise Uzungöl veya Fırtına Vadisi'nde geçireceğiniz çok duraklı konaklamaları sıklıkla koordine ediyoruz."

    # Final CTA
    final_eyebrow: "Kişiye Özel Konaklama"
    final_title: "Konaklamanız Yolculuğunuzun Bir Parçası Olsun."
    final_subtitle: "Tarihlerinizi, kişi sayınızı ve hayalinizdeki konaklama tarzını bize iletin. Müsaitlik durumunu kontrol edip en doğru tesisleri WhatsApp üzerinden birlikte belirleyelim."

