    # What's Included
    included_eyebrow: "Güvence"
    included_title: "Kiralama Hizmetinize Neler Dahil?"
    included_subtitle: "Yolculuğunuzu baştan sona huzurlu ve şeffaf kılmak için tasarlanmış standart hizmetler."
    inc_1_title: "Geniş Kapsamlı Araç Kaskosu"
    inc_1_desc: "Her rotada güvende olmanız için kiralama hizmetine kapsamlı araç sigortası dahildir."
    inc_2_title: "Şeffaf Fiyatlandırma ve Koşullar"
    inc_2_desc: "Günlük kiralama bedelleri ve teslimat şartları aracı teslim almadan önce açıkça teyit edilir."
    inc_3_title: "Yerel Koordinasyon ve Destek"
    inc_3_desc: "Teslimat koordinasyonu, adres yönlendirmesi ve yolculuğunuz sırasındaki genel seyahat danışmanlığı için ekibimize WhatsApp üzerinden ulaşabilirsiniz."
    inc_4_title: "Temiz ve Hazırlanmış Araç"
    inc_4_desc: "Aracınız teslimat öncesinde temizlenir, kontrol edilir ve yolculuğunuza hazır şekilde size teslim edilir."

    # Requirements / Before You Rent
    req_eyebrow: "Kiralama Öncesi"
    req_title: "Türkiye'de Genel Araç Kiralama Koşulları"
    req_subtitle: "Türkiye genelindeki araç kiralama sağlayıcıları standart evrak ve uygunluk kuralları uygular. Ziyaretçiler için genel pazar standartları şunlardır (hukuki tavsiye değildir):"
    req_1_title: "Geçerli Sürücü Belgesi"
    req_1_desc: "Araç grubuna göre belirlenen asgari ehliyet süresi (genellikle 1 ila 3 yıl). Latin alfabesi dışındaki ehliyetler için Uluslararası Sürücü Belgesi veya onaylı Türkçe tercüme talep edilmesi genel bir uygulamadır."
    req_2_title: "Sürücü Yaş Sınırları"
    req_2_desc: "Türkiye kiralama pazarında asgari sürücü yaşı ekonomik sınıfta genellikle 21'den başlar; orta sınıf ve SUV segmentinde 25-28 yaş şartı aranabilmektedir."
    req_3_title: "Pasaport ve Giriş Kontrolü"
    req_3_desc: "Yabancı ziyaretçilerin orijinal pasaportlarını ve Türkiye'ye yasal turistik giriş mührünü ibraz etmeleri araç kiralama firmaları tarafından rutin olarak istenir."
    req_4_title: "Kredi Kartı ve Provizyon"
    req_4_desc: "Trafik cezaları, HGS geçişleri veya yakıt farkları için ana sürücü adına düzenlenmiş kredi kartından geçici provizyon alınması Türkiye genelinde standart bir uygulamadır. Kesin şartlar ekibimizle teyit edilir."
    req_disclaimer: "Genel Bilgilendirme Notu: Yukarıdaki bilgiler Türkiye'deki genel sektör standartlarını yansıtmakta olup hukuki tavsiye niteliği taşımaz. Kesin gereksinimler ve kiralama koşulları araç modeline ve kiralama planına göre ekibimiz tarafından teyit edilir."

    # International Visitors Guide
    intl_eyebrow: "Yurtdışı Gezginleri"
    intl_title: "Yabancı Ziyaretçiler İçin Önemli Bilgiler"
    intl_subtitle: "Yabancı ziyaretçiler için Türkiye'deki genel trafik mevzuatı ve kiralama standartlarına dayalı pratik bilgiler (genel bilgilendirme amaçlıdır, hukuki tavsiye değildir)."
    intl_1_title: "Ulusal Ehliyetin Geçerliliği"
    intl_1_desc: "Türkiye genel trafik mevzuatına göre Latin harfli ulusal sürücü belgeleri, Türkiye'ye giriş tarihinden itibaren 6 aya kadar turist statüsünde kullanılabilir. Uzun süreli konaklayanların resmi mevzuatı incelemesi gerekir."
    intl_2_title: "Uluslararası Ehliyet Ne Zaman Gerekir?"
    intl_2_desc: "Sürücü belgeniz Arapça, Kiril vb. Latin dışı alfabelerle düzenlenmişse Uluslararası Sürücü Belgesi (IDP) veya onaylı tercüme talep edilmesi Türkiye'deki yaygın bir uygulamadır."
    intl_3_title: "Giriş Damgası Kontrolü"
    intl_3_desc: "Araç tesliminde pasaportunuzdaki yasal Türkiye giriş damgası kontrol edilebilir; seyahat evraklarınızı yanınızda bulundurmanız önemlidir."
    intl_4_title: "HGS ve Otoyol Geçişleri"
    intl_4_desc: "Türkiye'de köprü ve otoyollarda elektronik HGS sistemi kullanılır. Kiralama süresince yapılan geçişler elektronik olarak kaydedilir ve araç iadesinde hesaplanır."

    # How It Works
    flow_eyebrow: "Kolay Süreç"
    flow_title: "Kiralama Süreci Nasıl İşler?"
    flow_subtitle: "Karmaşık sözleşme formları olmadan, doğrudan iletişimle yürüyen kolay adımlar."
    flow_1_num: "01"
    flow_1_title: "Aracınızı Belirleyin"
