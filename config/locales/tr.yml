    grp_cpl_title: "Çiftler İçin"
    grp_cpl_desc: "Romantik bir kaçamak planlayan çiftler genellikle vadi manzaralı ahşap bungalovları, şömineli butik dağ evlerini ve doğanın sessizliğini tercih eder."
    grp_grp_title: "Gruplar İçin"
    grp_grp_desc: "Birlikte tatile çıkan geniş aileler ve arkadaş grupları için ortak verandası ve geniş salonu bulunan müstakil villalar ve yan yana yayla evleri en konforlu çözümdür."

