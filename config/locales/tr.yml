    # FAQ
    faq_eyebrow: "Merak Edilenler"
    faq_title: "Sıkça Sorulan Sorular"
    faq_1_q: "Şoförlü araç hizmetine neler dahildir?"
    faq_1_a: "Hizmet, kararlaştırılan süre ve rota boyunca yalnızca grubunuza tahsis edilen özel araç ve sürücüyü kapsar. Yakıt, günlük süre ve HGS otoyol geçişleri gibi ayrıntılar seçilen programa göre belirlenir ve rezervasyon öncesinde ekibimizle teyit edilir."
    faq_2_q: "Tam gün geziler için şoförlü araç ayarlayabilir miyim?"
    faq_2_a: "Evet. Uzungöl, Ayder Yaylası ve Sümela Manastırı gibi bölgeleri kendi temponuzda gezmek için tam günlük özel şoförlü turlar en çok tercih edilen seyahat şeklidir."
    faq_3_q: "Trabzon dışındaki şehirlere (Rize, Artvin vb.) gidebilir miyiz?"
    faq_3_a: "Evet. Trabzon'dan Rize, Artvin, Giresun ve Doğu Karadeniz'in diğer vadi ve yaylalarına önceden planlanarak şehirler arası seyahat ayarlanabilir."
    faq_4_q: "Şoför gezi ve yemek sırasında bizi bekliyor mu?"
    faq_4_a: "Evet. Anlaşılan günlük gezi programı boyunca şoförünüz siz ören yerlerini gezerken veya yemek yerken araç başında sizi bekler ve devam etmeye hazır bulunur."
    faq_5_q: "Fiyatlandırma nasıl belirlenir?"
    faq_5_a: "Fiyatlar talep edilen rota, toplam mesafe ve hizmet süresine göre hesaplanır. Tüm detaylar seyahatinizden önce net bir şekilde belirlenir; sürpriz ek ücretlerle karşılaşmazsınız."
    faq_6_q: "Ne kadar süre önceden rezervasyon yapmalıyım?"
    faq_6_a: "Özellikle araç talebinin yoğun olduğu yaz sezonunda ve bayram dönemlerinde seyahat tarihleriniz belli olur olmaz iletişime geçmenizi öneririz."
    faq_7_q: "Havalimanı karşılaması şoförlü geziye dahil edilebilir mi?"
    faq_7_a: "Evet. Şoförünüz sizi Trabzon Havalimanı'nda karşılayabilir ve doğrudan gezi rotanıza veya konaklama yerinize doğru yola çıkabilirsiniz."
    faq_8_q: "Aracı bizden biri de kullanabilir mi?"
    faq_8_a: "Hayır. Şoförlü kiralama kapsamındaki araçlar yalnızca yetkili şoför tarafından kullanılır. Kendi aracınızı sürmek istiyorsanız Bireysel Araç Kiralama hizmetimizi inceleyebilirsiniz."

    # Final CTA
    final_eyebrow: "Huzurlu Seyahat"
    final_title: "Yolu bize bırakın."
    final_subtitle: "Seyahat tarihlerinizi, gitmek istediğiniz yerleri ve kişi sayınızı bize iletin; aracınızı ve yolculuk planınızı doğrudan WhatsApp üzerinden birlikte netleştirelim."
