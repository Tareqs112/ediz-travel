    # FAQ Section
    faq_eyebrow: "إجابات شائعة"
    faq_title: "الأسئلة الأكثر تكراراً"
    faq_1_q: "ما هو الحد الأدنى للعمر لاستئجار سيارة؟"
    faq_1_a: "في سوق التأجير بتركيا، يبدأ الحد الأدنى للسن عادة من 21 عاماً للسيارات الاقتصادية، ويرتفع إلى 25 أو 28 عاماً لسيارات الدفع الرباعي والفئات الأعلى. يتم تأكيد المتطلبات الدقيقة وشروط التأجير مع فريقنا بحسب فئة السيارة وترتيبات الحجز."
    faq_2_q: "كم يجب أن تكون مدة سريان رخصة القيادة؟"
    faq_2_a: "تشترط شركات التأجير في تركيا عموماً أن تكون الرخصة صادرة منذ سنة إلى سنتين للسيارات العادية، و3 سنوات فأكثر للفئات الكبيرة. يتم تأكيد المتطلبات الدقيقة وشروط التأجير مع فريقنا بحسب فئة السيارة وترتيبات الحجز."
    faq_3_q: "هل أحتاج رخصة قيادة دولية؟"
    faq_3_a: "وفق القواعد العامة في تركيا، تُقبل الرخص الوطنية ذات الأحرف اللاتينية للسياح لمدة تصل إلى 6 أشهر. أما للرخص المكتوبة بالعربية فقط فيشيع طلب رخصة دولية (IDP) أو ترجمة تركية معتمدة. هذه معلومات إرشادية عامة ولا تُعتبر مشورة قانونية؛ يرجى التأكيد مع فريقنا قبل السفر."
    faq_4_q: "هل يشمل السعر التأمين على السيارة؟"
    faq_4_a: "نعم، يشمل استئجار السيارات المنظم عبر 61 EDİZ TRAVEL تأميناً شاملاً للمركبة. ويتم مراجعة وتأكيد كافة الشروط الدقيقة والتغطيات مع فريقنا قبل تأكيد الحجز."
    faq_5_q: "هل يلزم وجود بطاقة ائتمانية ومبلغ تأمين؟"
    faq_5_a: "الممارسة الشائعة في تركيا تقتضي وجود بطاقة ائتمانية باسم السائق الرئيسي لحجز مبلغ تفويض مؤقت لتغطية رسوم الطرق السريعة (HGS) وفروقات الوقود. يتم تأكيد المتطلبات الدقيقة وشروط التأجير مع فريقنا بحسب فئة السيارة وترتيبات الحجز."
    faq_6_q: "هل يمكن لشخص آخر قيادة السيارة؟"
    faq_6_a: "نعم، يمكن إضافة سائق إضافي في عقد الإيجار بعد تقديم رخصته وجواز سفره واستيفائه لشروط السن والرخصة. يرجى إبلاغ فريقنا مسبقاً."
    faq_7_q: "هل يمكن استلام أو تسليم السيارة في مطار طرابزون؟"
    faq_7_a: "نعم، يمكن ترتيب تسليم واستلام السيارة في مطار طرابزون بالتنسيق المسبق بما يتوافق مع مواعيد رحلات طيرانكم، كما يمكن الاتفاق مسبقاً على مواقع تسليم بديلة."
    faq_8_q: "كيف أطلب استئجار سيارة؟"
    faq_8_a: "يكفي الضغط على زر 'اختر سيارتك' أو زر واتساب المتوفر في هذه الصفحة، وتزويدنا بالتواريخ ونوع السيارة لنفيدكم بالخيارات المتاحة والشروط الدقيقة."

