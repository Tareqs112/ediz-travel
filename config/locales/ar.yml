    flow_2_num: "02"
    flow_2_title: "ننسق تفاصيل الرحلة"
    flow_2_desc: "نؤكد توافر السيارة، ونتفق على خط السير والمواعيد، ونحدد السعر الإجمالي الشفاف مسبقاً."
    flow_3_num: "03"
