    vs_self_point_3: "حرية الاستكشاف الفردي في القرى النائية بمرونة مطلقة"
    vs_self_link: "استكشف خدمة استئجار السيارات"

    # Use Cases
    cases_eyebrow: "ترتيبات السفر"
    cases_title: "أبرز استخدامات خدمة السائق الخاص"
    cases_subtitle: "يمكن ترتيب خدمات السائق الخاص لتلائم مختلف احتياجات السفر في الشمال التركي. ناقش مسارك مع فريقنا:"
    case_1_title: "جولات سياحية يومية كاملة"
    case_1_desc: "رحلات ليوم كامل إلى أوزنجول، أو هضبة آيدر، أو دير سوميلا، مع بقاء السائق بانتظاركم أثناء الزيارة."
    case_2_title: "تنقلات بين المدن والأودية"
    case_2_desc: "تنقلات مريحة ومباشرة بين طرابزون وريزه والقرى الساحلية والأكواخ الجبلية الموزعة."
    case_3_title: "خدمة المطار والإقامات الريفية"
    case_3_desc: "استقبال من مطار طرابزون والانطلاق مباشرة إلى منتجعات وأكواخ المرتفعات حيث تقل المواصلات العامة."
    case_4_title: "رحلات العائلات والمجموعات"
    case_4_desc: "مساحات واسعة ومريحة للأمتعة وعربات الأطفال للتنقل بسلاسة بين المطاعم والإطلالات."

