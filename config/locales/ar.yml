    # Requirements / Before You Rent
    req_eyebrow: "قبل الاستئجار"
    req_title: "الشروط العامة لاستئجار السيارات في تركيا"
    req_subtitle: "تتبع مكاتب تأجير السيارات في تركيا معايير عامة للوثائق والأهلية. وفيما يلي أبرز الإجراءات المعتادة كإرشادات عامة للمسافرين (لا تُعد مشورة قانونية):"
    req_1_title: "رخصة قيادة سارية"
    req_1_desc: "رخصة قيادة وطنية مضى على استخراجها حد أدنى (غالباً من سنة إلى 3 سنوات حسب فئة السيارة). الرخص الصادرة بحروف غير لاتينية قد تتطلب رخصة قيادة دولية أو ترجمة معتمدة وفق الممارسات المعتادة."
    req_2_title: "العمر المسموح للسائق"
    req_2_desc: "يبدأ الحد الأدنى للسن عادة من 21 عاماً للسيارات الاقتصادية، ويرتفع إلى 25 أو 28 عاماً للفئات المتوسطة والكبيرة والدفع الرباعي بحسب تصنيف السيارة."
    req_3_title: "جواز السفر وختم الدخول"
    req_3_desc: "يتوجب على الزائر الأجنبي إبراز جواز السفر الأصلي مع ختم الدخول الرسمي إلى تركيا ساري المفعول ضمن الفترة السياحية المسموحة."
    req_4_title: "البطاقة الائتمانية والوديعة"
    req_4_desc: "تطلب شركات التأجير في تركيا بطاقة ائتمانية (Credit Card) باسم السائق الرئيسي لحجز مبلغ تفويض مؤقت لتغطية رسوم الطرق السريعة (HGS) أو فروقات الوقود. يتم تأكيد الترتيبات الدقيقة مع فريقنا."
    req_disclaimer: "تنبيه استرشادي: المعلومات أعلاه تعكس المعايير العامة المعمول بها في سوق تأجير السيارات بتركيا وتُقدم لأغراض التوجيه العام ولا تُعد استشارة قانونية. يتم تأكيد المتطلبات الدقيقة وشروط التأجير مع فريقنا بحسب فئة السيارة وترتيبات الحجز."

    # International Visitors Guide
    intl_eyebrow: "للمسافرين الدوليين"
    intl_title: "إرشادات القيادة للزوار الأجانب في تركيا"
    intl_subtitle: "إرشادات عملية مستندة إلى القواعد العامة للمرور وسوق التأجير في تركيا (معلومات استرشادية ولا تُعد استشارة قانونية)."
    intl_1_title: "صلاحية الرخصة الوطنية"
    intl_1_desc: "وفقاً للقواعد العامة للمرور في تركيا، يحق للسياح الأجانب القيادة برخصتهم الوطنية المكتوبة بأحرف لاتينية لمدة تصل إلى 6 أشهر من تاريخ الدخول. ويُنصح الزوار لفترات أطول بمراجعة الجهات الرسمية."
    intl_2_title: "متى تحتاج الرخصة الدولية (IDP)؟"
    intl_2_desc: "وفق الممارسات الشائعة لدى مكاتب التأجير في تركيا، إذا كانت رخصتك صادرة بحروف غير لاتينية (كالعربية أو السيريلية)، فإن توفير رخصة قيادة دولية (IDP) أو ترجمة معتمدة يُعد إجراءً معتاداً لتسهيل التسليم."
    intl_3_title: "أهمية ختم الدخول في الجواز"
    intl_3_desc: "يتحقق موظف التسليم عادة من ختم الدخول إلى الأراضي التركية للتأكد من الصفة السياحية النظامية، لذا يرجى إبقاء وثائق سفركم معكم."
    intl_4_title: "رسوم الطرق السريعة (HGS)"
    intl_4_desc: "تعتمد الطرق والجسور في تركيا نظام البوابات الإلكترونية (HGS). يتم تسجيل العبور آلياً عبر جهاز الاستشعار وتتم المحاسبة على الاستهلاك عند إعادة السيارة."

