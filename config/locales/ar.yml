    req_4_desc: "الحاجة لمقاعد أطفال أو ترتيبات توقف محددة أثناء الرحلة."

    # FAQ
    faq_eyebrow: "إجابات شائعة"
    faq_title: "الأسئلة الأكثر تكراراً"
    faq_1_q: "ما الذي تشمله خدمة السيارة مع السائق؟"
    faq_1_a: "تشمل الخدمة سيارة خاصة مريحة وسائقاً مخصصاً بالكامل لخدمتكم طوال المسار والوقت المتفق عليهما. أما تفاصيل الوقود وساعات الخدمة ورسوم الطرق السريعة (HGS) فيتم تأكيدها وتوضيحها مع فريقنا مسبقاً بحسب طبيعة رحلتكم."
    faq_2_q: "هل يمكن حجز السائق ليوم كامل للجولات السياحية؟"
    faq_2_a: "نعم، حجز السائق الخاص ليوم كامل هو الطريقة الأكثر راحة وشعبية لزيارة معالم الشمال التركي مثل أوزنجول وآيدر ودير سوميلا بوتيرة هادئة."
    faq_3_q: "هل يمكننا السفر إلى وجهات خارج طرابزون كـ ريزه أو آيدر؟"
    faq_3_a: "نعم، يمكن ترتيب جولات وتنقلات تشمل ريزه، وآرتفين، وجيرسون، ومختلف وديان وهضاب البحر الأسود بالتنسيق المسبق مع فريقنا."
    faq_4_q: "هل ينتظرنا السائق أثناء الجولات السياحية والغداء؟"
    faq_4_a: "نعم، في الرحلات اليومية المتفق عليها، ينتظركم السائق أثناء تجولكم في المعالم أو تناولكم للوجبات، ويكون جاهزاً للانطلاق متى رغبتم."
    faq_5_q: "كيف يتم تحديد السعر؟"
    faq_5_a: "يُحسب السعر بناءً على خط السير المطلوب، والمسافة، ومدة الخدمة. ويتم تقديم عرض سعر واضح وشفاف مسبقاً دون أي تكاليف خفية."
    faq_6_q: "متى ينبغي لي التواصل لحجز الخدمة؟"
    faq_6_a: "يُفضل التواصل بمجرد تأكيد مواعيد رحلات طيرانكم، وخاصة خلال موسم الصيف والعطلات حيث يرتفع الطلب على السيارات العائلية الخاصة في الشمال التركي."
    faq_7_q: "هل يمكن دمج الاستقبال من المطار مع الجولة اليومية؟"
    faq_7_a: "نعم، يمكن للسائق استقبالكم من مطار طرابزون والانطلاق مباشرة لتنفيذ خط السير أو التوجه إلى مقر إقامتكم حسب رغبتكم."
    faq_8_q: "هل يحق لأحد المسافرين قيادة السيارة؟"
    faq_8_a: "لا، السيارة في هذه الخدمة يقودها السائق المعتمد فقط. إذا كنتم ترغبون في قيادة السيارة بأنفسكم، يمكنكم الاطلاع على خدمة تأجير السيارات ذاتية القيادة."

    # Final CTA
    final_eyebrow: "سياحة مريحة"
    final_title: "دع مهمة القيادة لنا."
    final_subtitle: "أرسل لنا تواريخ رحلتك، والوجهات التي ترغب بزيارتها، وعدد الركاب. وسنؤكد لك توافر السيارة ونرتب رحلتك مع السائق مباشرة عبر واتساب."
