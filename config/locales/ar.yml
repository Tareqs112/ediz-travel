    when_4_title: "لمن يفضل عدم القيادة في السفر"
    when_4_desc: "تفرغ للأحاديث العائلية والتقاط الصور التذكارية دون القلق من أجهزة الملاحة وقوانين السير في بلد غريب."

    # Flow
