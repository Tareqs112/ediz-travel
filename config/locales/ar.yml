    type_bungalows_desc: "أكواخ مبنية بالأخشاب الطبيعية وموزعة على سفوح الوديان الخضراء وضفاف الجداول ومزارع الشاي. تمنحكم شرفاتها الخاصة تجربة أصيلة للعيش في أحضان الطبيعة الريفية."
    type_bungalows_suit: "الأنسب لـ: الأزواج وعشاق الهدوء والباحثين عن معايشة هواء الجبال العليل."
    type_chalets_badge: "ملاذات الجبال"
    type_chalets_title: "الشاليهات وبيوت المرتفعات"
    type_chalets_desc: "منازل خشبية وحجرية فسيحة تقع في المرتفعات الجبلية والمناطق المحيطة بأوزنجول وآيدر. تجمع بين الدفء الريفي والإطلالات الخلابة على السحاب والوديان."
    type_chalets_suit: "الأنسب لـ: العائلات، والمجموعات الصغيرة، والإقامات الاستجمامية الممتدة."
    type_apartments_badge: "استقلالية عائلية"
    type_apartments_title: "الشقق المفروشة بالكامل"
    type_apartments_desc: "شقق فندقية وسكنية مؤثثة تضم غرف نوم متعددة وصالات جلوس رحبة ومطابخ مجهزة. تقع في أحياء هادئة بطرابزون، وتوفر أجواء المنزل وخصوصية تامة."
    type_apartments_suit: "الأنسب لـ: العائلات الكبيرة، والإقامات الطويلة، والراغبين في مساحات واسعة."

    # Where to Stay Section
    where_eyebrow: "جغرافيا الشمال التركي"
    where_title: "أين تفضل أن تكون نقطة إقامتك؟"
    where_subtitle: "تتميز كل منطقة بطبيعة فريدة ومزايا جغرافية خاصة. نساعدكم في اختيار الموقع الأنسب لخطتكم:"
    loc_1_name: "مدينة طرابزون والساحل"
    loc_1_tag: "نقطة الانطلاق الحضرية"
    loc_1_desc: "خيار مثالي للراغبين في القرب من مطار طرابزون، والكورنيش الساحلي، والمعالم التاريخية كمسجد آيا صوفيا وقصر أتاتورك، ومطاعم المأكولات البحرية. تشكل قاعدة ممتازة للجولات في مختلف الاتجاهات."
    loc_2_name: "أوزنجول والوديان المجاورة"
    loc_2_tag: "البحيرة الجبلية الشهيرة"
    loc_2_desc: "تقع بين جبال سوانلي وغابات الصنوبر الشاهقة. تتيح لكم الإقامة هناك اختبار أجواء البحيرة الهادئة في الصباح الباكر والمساء بعد مغادرة الزوار اليوميين."
    loc_3_name: "مرتفعات آيدر ووادي فارتينا"
    loc_3_tag: "المروج الخضراء والشلالات"
    loc_3_desc: "تشتهر بالشلالات المتدفقة وجسور المشاة الحجرية القديمة ومزارع الشاي. موقع مثالي للمسافرين الراغبين في استكشاف جبال كاجكار وقلاع وادي فارتينا ومروج إليفيت وهوسر."
    loc_4_name: "المرتفعات والقرى الريفية"
    loc_4_tag: "سكينة فوق السحاب"
    loc_4_desc: "موزعة على قمم حيدر نبي وماتشكا وزيغانا. تمنح هذه الأماكن ضيوفها هواءً نقياً وضيافة قروية أصيلة وأقصى درجات الخصوصية والابتعاد عن صخب الأماكن السياحية."

    # Comparison: City vs Nature
    vs_eyebrow: "مقارنة البيئات"
    vs_title: "الإقامة في المدينة أم بين أحضان الطبيعة؟"
    vs_subtitle: "فكر في النمط الذي يلائم وتيرة رحلتكم وتفضيلات عائلتكم قبل تثبيت مكان السكن."
    vs_city_badge: "إقامة المدينة"
    vs_city_title: "طرابزون والساحل"
    vs_city_point_1: "وصول سريع لمطار طرابزون والطرق الساحلية السريعة"
    vs_city_point_2: "القرب من المطاعم والأسواق والمقاهي والمعالم التاريخية"
    vs_city_point_3: "بنية تحتية متكاملة وشبكات اتصال سريعة ومراكز صحية"
    vs_city_point_4: "موقع مركزي متوازن للرحلات اليومية باتجاهات مختلفة"
    vs_nature_badge: "إقامة الطبيعة"
    vs_nature_title: "الوديان والبحيرات والمرتفعات"
    vs_nature_point_1: "أجواء جبلية هادئة وهواء عذب وإطلالات صنوبرية مريحة"
    vs_nature_point_2: "بدء الصباح وسط المشاهد الطبيعية دون الحاجة للقيادة الطويلة"
    vs_nature_point_3: "أمسيات ساكنة بعد مغادرة حافلات الزوار والرحلات النهارية"
    vs_nature_point_4: "شرفات خشبية وجداول مائية تنقل لكم روح الريف التركي"

    # How We Help Choose
    help_eyebrow: "ترشيحات شخصية"
    help_title: "كيف نساعدكم في اختيار الإقامة المناسبة؟"
    help_subtitle: "بدلاً من الحيرة بين مئات الخيارات عبر الإنترنت، ينسق فريقنا المحلي خياراتكم بناءً على معطيات رحلتكم الفعلية."
    help_1_title: "خط سير رحلتكم اليومي"
    help_1_desc: "نربط مواقع السكن بمخطط زياراتكم لتجنب العودة المتكررة عبر المنعطفات والمسافات الطويلة."
    help_2_title: "عدد الأفراد وتوزيع الأسرة"
    help_2_desc: "نتأكد من أن تقسيم الغرف والمساحات يلبي راحة العائلة والخصوصية التامة دون ضيق."
    help_3_title: "ملاءمة الطريق ونوع السيارة"
    help_3_desc: "بعض الشاليهات الجبلية تقع في ممرات وعرة، لذا نوضح لكم طبيعة الوصول إليها بدقة سواء كنتم تستأجرون سيارة أو معكم سائق خاص."
    help_4_title: "التواصل العملي مع أصحاب المنشآت"
    help_4_desc: "نعطي الأولوية لأماكن الإقامة المستقرة والمعروفة محلياً، ونتواصل مباشرة مع المضيفين للتأكد من تفاصيل المكان وتوضيح التوقعات قبل وصولكم."

    # Considerations Before Choosing
    consider_eyebrow: "إرشادات عملية"
    consider_title: "أمور ينبغي مراعاتها قبل اتخاذ القرار"
    consider_subtitle: "ضعوا هذه الحقائق الجغرافية في الحسبان لضمان اختيار مكان الإقامة الأمثل."
    con_1_title: "طبيعة الطرق الجبلية"
    con_1_desc: "تقع بعض الأكواخ في طرق فرعية متعرجة؛ احرصوا على اختيار وسيلة النقل المناسبة إذا كنتم تفضلون عدم القيادة في المرتفعات."
    con_2_title: "طقس المرتفعات المتقلب"
    con_2_desc: "درجات الحرارة في الجبال أبرد بشكل ملحوظ مقارنة بالساحل، والضباب والأمطار واردة حتى في الصيف، لذا ننصحكم بالتحقق من وسائل التدفئة مع مكان الإقامة."
    con_3_title: "توفر خيارات الطعام"
    con_3_desc: "بينما تجاور فنادق المدينة كافة المطاعم، قد يتطلب العشاء في الأكواخ المنعزلة استخدام السيارة أو اختيار أماكن توفر مطبخاً أو وجبات طعام داخلية."
    con_4_title: "السلالم ونقل الحقائب"
    con_4_desc: "تتألف الأكواخ الخشبية المزدوجة والشاليهات في الغالب من طابقين بسلالم خشبية، وهو ما ينبغي مراعاته لكبار السن أو العائلات التي لديها عربات أطفال."

    # For Families, Couples, Groups
    groups_eyebrow: "خيارات للمسافرين"
    groups_title: "حلول تناسب كافة أنواع الرحلات"
    groups_subtitle: "تختلف أولويات الإقامة اختلافاً جذرياً بحسب طبيعة المسافرين وعدد أفرادهم."
    grp_fam_title: "للعائلات"
    grp_fam_desc: "تهتم العائلات بالمساحات الفسيحة والمطابخ المجهزة والشرفات الآمنة وسهولة صف السيارة، وتوفر الشقق العائلية والشاليهات الجبلية الرحابة والاستقلالية المطلوبة."
    grp_cpl_title: "للأزواج"
    grp_cpl_desc: "يبحث الأزواج في رحلات الاستجمام عن أكواخ خشبية هادئة مطلة على الجداول المائية أو شاليهات دافئة بمدفأة حطب وإطلالة ساحرة على الضباب."
    grp_grp_title: "للمجموعات الكبيرة"
    grp_grp_desc: "تفضل العائلات الكبيرة والمجموعات الفلل المستقلة أو الشاليهات المتقاربة ذات الشرفات المشتركة للاجتماع وتناول الشاي وقضاء أوقات مسائية ممتعة."

    # Journey Flow (01 to 05)
    flow_eyebrow: "خطوات ميسرة"
    flow_title: "كيف تتم عملية تنسيق الإقامة؟"
    flow_subtitle: "إجراءات واضحة ومباشرة تضمن لكم حجز الإقامة الملائمة بكل طمأنينة."
    flow_1_num: "01"
    flow_1_title: "شاركنا تفاصيل رحلتكم"
    flow_1_desc: "أرسلوا لنا تواريخ السفر، وعدد الضيوف، وأعمار الأطفال، وموعد الوصول التقريبي عبر واتساب."
    flow_2_num: "02"
    flow_2_title: "حددوا نمط الإقامة المفضل"
    flow_2_desc: "أخبرونا بتفضيلاتكم: فندق في المدينة، كوخ على البحيرة، شاليه جبلي، أم شقة عائلية."
    flow_3_num: "03"
    flow_3_title: "استلام الخيارات المقترحة"
    flow_3_desc: "ندرس التوافر الفعلي وتوافق الموقع مع جدولكم، ونشارككم الترشيحات المناسبة."
    flow_4_num: "04"
    flow_4_title: "تأكيد الحجز المختار"
    flow_4_desc: "عند الاستقرار على المكان الذي يروق لكم، يتم تثبيت تفاصيل الحجز وتأكيده بشكل دقيق."
    flow_5_num: "05"
    flow_5_title: "التنسيق مع خدمات الرحلة"
    flow_5_desc: "يتم ربط موعد وموقع السكن بسلاسة مع خدمة الاستقبال في المطار أو السيارة المستأجرة أو السائق الخاص."

    # Travel Ecosystem Integration
    eco_eyebrow: "رحلة متكاملة"
    eco_title: "الإقامة كجزء من منظومة رحلتكم الشاملة"
    eco_subtitle: "الرحلة الناجحة لا تقتصر على سرير مريح، بل ترتبط بتكامل السكن مع خدمات النقل والجولات الاستكشافية."
    eco_transfer_title: "توصيل المطار"
    eco_transfer_desc: "استقبال مباشر من مطار طرابزون ونقلكم براحة وأمان إلى باب فندقكم أو كوخكم الجبلي دون عناء الأمتعة."
    eco_transfer_link: "تفاصيل توصيل المطار"
    eco_rental_title: "تأجير السيارات"
    eco_rental_desc: "سيارة حديثة ومفحوصة جاهزة لاستكشاف الوديان والقرى الريفية بحرية واستقلالية كاملة وفق رغبتكم."
    eco_rental_link: "تفاصيل استئجار السيارات"
    eco_chauff_title: "سيارة خاصة مع سائق"
    eco_chauff_desc: "دع وعورة الطرق الجبلية ومواقف السيارات لسائق محلي خبير واستمتع بالمناظر الطبيعية الخلابة."
    eco_chauff_link: "تفاصيل سيارة مع سائق"
    eco_tours_title: "جولات سياحية خاصة"
    eco_tours_desc: "انطلاق الجولات اليومية الخاصة من باب مكان إقامتكم مباشرة لزيارة صومعة سوميلا وأوزنجول وآيدر."
    eco_tours_link: "تفاصيل الجولات الخاصة"

    # Practical FAQ
    faq_eyebrow: "الأسئلة الشائعة"
    faq_title: "أسئلة يطرحها المسافرون حول الإقامة"
    faq_1_q: "ما هي أنواع أماكن الإقامة التي يمكنكم ترتيبها؟"
    faq_1_a: "ننسق حجوزات الفنادق المتنوعة، والأكواخ الخشبية النهرية، والشاليهات الجبلية، والشقق المفروشة بالكامل في طرابزون ومحيطها."
    faq_2_q: "في أي مناطق البحر الأسود توفرون خيارات الإقامة؟"
    faq_2_a: "نساعدكم في ترتيب الإقامة في مركز مدينة طرابزون، وأكشابات، وأوزنجول، وتشايكارا، وريزا، ووادي فارتينا، وهضبة آيدر، والقرى الجبلية المجاورة."
    faq_3_q: "هل الأفضل الإقامة في طرابزون أم في المناطق الطبيعية والريفية؟"
    faq_3_a: "يختار العديد من ضيوفنا برنامجاً متوازناً: قضاء ليلتين إلى ثلاث ليالٍ في فندق بمركز طرابزون للتسوق وزيارة المعالم التاريخية، يعقبها قضاء ليلتين إلى ثلاث في كوخ أو شاليه في أوزنجول أو آيدر للهدوء والاستجمام."
    faq_4_q: "هل يمكن حجز الإقامة بالتزامن مع خدمات النقل والسائق؟"
    faq_4_a: "نعم بكل تأكيد. يساعد التنسيق الموحد بين السكن والمواصلات في معرفة السائق بدقة لموقع السكن الجبلي ومواعيد الدخول والمغادرة."
    faq_5_q: "هل الشقق والشاليهات مناسبة للعائلات الكبيرة؟"
    faq_5_a: "نعم، تعد الشقق متعددة الغرف في طرابزون والشاليهات في الوديان الخيار الأكثر طلباً للعائلات التي ترغب في صالة معيشة ومطبخ مستقل وخصوصية تامة."
    faq_6_q: "هل تقدمون المشورة لاختيار الإقامة بناءً على خط سير رحلتنا؟"
    faq_6_a: "بالتأكيد. ما عليكم سوى مشاركة الأماكن التي تودون زيارتها مع فريقنا، وسنرشح لكم محطات الإقامة الأكثر ملاءمة لتقليل المسافات وأوقات القيادة."
    faq_7_q: "كم من الوقت قبل الرحلة يُنصح بالتواصل لترتيب الإقامة؟"
    faq_7_a: "في موسم الصيف الذروة (من يونيو إلى سبتمبر)، تحجز الأكواخ الخشبية والشاليهات المميزة قبل أشهر من موعدها. ننصحكم بالتواصل معنا فور تأكيد مواعيد رحلاتكم وتذاكر الطيران."
    faq_8_q: "هل يمكن ترتيب إقامة مقسمة بين أكثر من منطقة ووادٍ؟"
    faq_8_a: "نعم، ننسق بانتظام إقامات متعددة المحطات تشمل المبيت في طرابزون ثم الانتقال للمبيت في أوزنجول أو آيدر وفق رغبتكم."

    # Final CTA
    final_eyebrow: "إقامة مخصصة"
    final_title: "اجعل مكان إقامتك جزءاً أصيلاً من ذكريات الرحلة."
    final_subtitle: "شاركنا تواريخ سفرك وعدد أفراد عائلتك والنمط المفضل لإقامتك، وسنساعدك في اختيار المكان الأجمل عبر واتساب مباشرة."

