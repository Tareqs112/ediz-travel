    included_eyebrow: "مشتملات الخدمة"
    included_title: "ما الذي تشمله الخدمة؟"
    included_subtitle: "معايير محددة لضمان تجربة تنقل مريحة وخالية من المفاجآت."
    inc_1_title: "سيارة خاصة مخصصة لكم"
    inc_1_desc: "سيارة نظيفة ومكيفة بالكامل مخصصة لعائلتك دون مشاركة أي ركاب آخرين."
    inc_2_title: "سائق محلي متمرس"
    inc_2_desc: "سائق مهذب على دراية واسعة بمسارات الشمال التركي وأماكن التوقف المميزة."
    inc_3_title: "مسار ومواعيد متفق عليها"
    inc_3_desc: "تنقلات يومية منظمة تراعي برنامجكم وأوقات التوقف والعودة المتفق عليها."
    inc_4_title: "مساندة مستمرة من الفريق"
    inc_4_desc: "فريق مكتبنا متواصل معكم عبر واتساب لأي استفسار أو تنسيق خلال فترة رحلتكم."
    included_disclaimer: "ملاحظة: تفاصيل مثل الوقود، ورسوم الطرق السريعة (HGS)، وساعات الخدمة اليومية، والمسافات تعتمد على المسار والبرنامج المختار. يتم تأكيد كافة الشروط بوضوح تام مع فريقنا قبل انطلاق الرحلة."

