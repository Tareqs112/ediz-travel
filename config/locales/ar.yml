    flow_4_num: "04"
    flow_4_title: "استمتع بمرونة متفق عليها"
    flow_4_desc: "توقف للاستمتاع بالإطلالات الخلابة وتناول الشاي والوجبات الريفية ضمن برنامج رحلتكم اليومي."

