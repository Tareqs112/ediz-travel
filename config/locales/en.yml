    inc_4_desc: "Your vehicle is cleaned, checked, and prepared before handover so you can begin your journey with confidence."

    # Requirements / Before You Rent
    req_eyebrow: "Before You Rent"
    req_title: "General Rental Standards in Türkiye"
    req_subtitle: "Car rental providers across Türkiye generally follow standard documentation and eligibility practices. The points below reflect common market standards (provided for general guidance, not legal advice):"
    req_1_title: "Valid Driving Licence"
    req_1_desc: "A national driving licence held for a qualifying period (commonly 1 to 3 years depending on vehicle category). Licences in non-Latin scripts typically require an International Driving Permit or certified translation under standard Turkish rental practice."
    req_2_title: "Driver Age Standards"
    req_2_desc: "In the Turkish rental market, minimum driver age generally ranges from 21 for economy vehicles to 25–28 for higher categories and SUVs, depending on the vehicle class."
    req_3_title: "Passport & Entry Verification"
    req_3_desc: "Original passport and proof of regular tourist entry into Türkiye (valid tourist entry stamp) are routinely requested by car rental providers in Türkiye."
    req_4_title: "Payment & Security Deposit"
    req_4_desc: "In standard Turkish rental practice, a credit card in the primary driver's name is typically requested for a temporary deposit pre-authorization covering road tolls (HGS), fuel variances, or incidental fees. Exact arrangements are confirmed with our team."
    req_disclaimer: "General Guidance Notice: Information regarding regulations and market standards in Türkiye is provided for traveler guidance and does not constitute legal advice. Exact requirements and rental conditions are confirmed with our team based on the vehicle and rental arrangement."

    # International Visitors Guide
    intl_eyebrow: "International Visitors"
    intl_title: "Information for Foreign Travelers"
    intl_subtitle: "Practical information based on general Turkish traffic regulations and rental market practice for foreign visitors (general guidance, not legal advice)."
    intl_1_title: "National Driving Licence Validity"
    intl_1_desc: "Under general Turkish traffic regulations, foreign tourists may drive on a valid national driving licence for up to 6 months from their entry date, provided the licence is in Latin script. Long-term visitors or residents should consult official regulations."
    intl_2_title: "When an IDP is Needed"
    intl_2_desc: "If your national licence is issued in non-Latin characters (such as Arabic, Cyrillic, or Chinese), an International Driving Permit (IDP) or certified Turkish translation is standard practice among rental operators in Türkiye."
    intl_3_title: "Entry Stamp Requirements"
    intl_3_desc: "Rental providers in Türkiye typically inspect the entry stamp in your passport to verify regular tourist status. Please keep your passport and travel documentation accessible."
    intl_4_title: "Tolls & Road Systems"
    intl_4_desc: "Highways and bridges across Türkiye utilize an electronic toll transponder system (HGS). Toll charges incurred during your trip are recorded electronically and settled upon vehicle return."

    # How It Works
    flow_eyebrow: "Simple Coordination"
    flow_title: "How the Rental Process Works"
    flow_subtitle: "A direct, personal coordination process without rigid checkouts."
    flow_1_num: "01"
    flow_1_title: "Select Your Vehicle"
