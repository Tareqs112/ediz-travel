    # What's Included
    included_eyebrow: "Peace of Mind"
    included_title: "What is Included With Your Rental"
    included_subtitle: "Clear inclusions designed to keep your journey straightforward and worry-free."
    inc_1_title: "Comprehensive Vehicle Insurance"
