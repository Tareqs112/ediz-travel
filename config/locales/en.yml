    plan_transfer: Plan Your Transfer
    whatsapp_message: "Hello 61 EDİZ TRAVEL, I would like to arrange a private airport transfer in Trabzon. My arrival details are:"
    
    # Experience Journey
    experience_eyebrow: The Arrival Experience
