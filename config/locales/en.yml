    vs_chauff_title: "Dedicated Local Driver"
    vs_chauff_point_1: "Sit back and relax without navigating mountain roads"
    vs_chauff_point_2: "No concerns about parking, directions, or local traffic"
    vs_chauff_point_3: "A local driver with practiced regional road experience"
    vs_chauff_link: "Explore Chauffeured Car Service"

    # FAQ Section
    faq_eyebrow: "Common Questions"
    faq_title: "Frequently Asked Questions"
    faq_1_q: "What is the minimum age to rent a car?"
    faq_1_a: "In the Turkish rental market, minimum driver age commonly starts at 21 years old for economy vehicles, with higher thresholds (often 25 to 28) for mid-size cars and SUVs. Exact requirements and rental conditions are confirmed with our team based on the vehicle and rental arrangement."
    faq_2_q: "How long must I have held my driving licence?"
    faq_2_a: "Across Türkiye, rental providers generally ask for 1 to 2 years of driving licence tenure for standard vehicles, and 3 or more years for higher categories. Exact requirements and rental conditions are confirmed with our team based on the vehicle and rental arrangement."
    faq_3_q: "Do international visitors need an International Driving Permit (IDP)?"
    faq_3_a: "Under general Turkish regulations, Latin-script national licences are commonly accepted for tourist stays up to 6 months. If your licence is in Arabic, Cyrillic, or another non-Latin script, an International Driving Permit (IDP) or certified translation is standard in Türkiye. This is general guidance and not legal advice; please confirm with our team before your arrival."
    faq_4_q: "Is insurance included in the rental price?"
    faq_4_a: "Yes. Comprehensive vehicle insurance is included with vehicle rentals arranged through 61 EDİZ TRAVEL. Exact coverage terms and standard conditions are confirmed with our team prior to booking."
    faq_5_q: "Is a security deposit or credit card required?"
    faq_5_a: "In standard Turkish rental practice, a credit card in the primary driver's name is typically used for a temporary pre-authorization deposit to cover electronic tolls (HGS), fuel variances, or incidental items. Exact requirements and rental conditions are confirmed with our team based on the vehicle and rental arrangement."
    faq_6_q: "Can another person also drive the vehicle?"
    faq_6_a: "Additional drivers can usually be registered on the rental agreement if they meet the required age and licence criteria and present their documents. Please notify our team in advance."
    faq_7_q: "Can I collect or return the car at Trabzon Airport?"
    faq_7_a: "Yes. Vehicle collection and return at Trabzon Airport can be arranged by prior coordination to match your flight schedule. Alternative meeting locations can also be agreed with our team in advance."
    faq_8_q: "How do I request a vehicle?"
    faq_8_a: "Simply click 'Find Your Car' or message us on WhatsApp. Share your preferred dates, party size, and vehicle choice, and our team will confirm available options and exact rental conditions."

